name: Implementation task
description: Define one bounded, reviewable engineering outcome.
title: "task: "
labels: []
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: One sentence describing what is true when this issue closes.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and constraints
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Use observable checkboxes.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and next action
    validations:
      required: true
