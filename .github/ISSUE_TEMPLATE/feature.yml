name: Feature proposal
description: Propose a focused improvement to repository visibility or workflow.
title: "proposal: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the recurring problem before proposing implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a user be able to understand or accomplish?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing workflow and alternatives
      description: How is this handled today, including by other tools?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Suggested scope boundary
      description: What should explicitly remain out of scope?
  - type: checkboxes
    id: fit
    attributes:
      label: Product fit
      options:
        - label: This does not require a central service or cloud account.
        - label: This does not silently execute repository code.
        - label: This complements rather than replaces a full Git client.
